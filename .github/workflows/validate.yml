name: validate

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -c "import glob, nbformat; [nbformat.validate(nbformat.read(p, as_version=4)) for p in glob.glob('notebooks/*.ipynb')]"
