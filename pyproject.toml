[project]
name = "pretaverdi"
version = "0.1.0"
description = "Agri-climate data exploration for food-security preparedness (Phase 1 of an AI agent project)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "jupyterlab>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pretaverdi"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
